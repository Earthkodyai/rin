version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-and-build:
        patterns: ["org.jetbrains.kotlin*", "com.android.*", "com.google.devtools.ksp*", "com.google.dagger*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directories: [/web/character, /tools/character]
    schedule:
      interval: weekly
    groups:
      three:
        patterns: ["three", "@types/three", "@pixiv/three-vrm*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
