<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Bangers&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f4ece6; font-family: 'M PLUS Rounded 1c', sans-serif; }
  .row { display: flex; gap: 14px; padding: 8px 14px; align-items: flex-start; }
  .label { font: 800 24px 'M PLUS Rounded 1c'; color: #3a2430; padding: 12px 14px 0; }
  .big { width: 300px; height: 363px; background: #fff; border-radius: 18px; }
  .panel { position: relative; width: 610px; height: 363px; overflow: hidden; }
  .panel img { position: absolute; inset: 0; width: 610px; height: 363px; }
  .cover { position: absolute; left: 30px; top: 20px; width: 262px; height: 160px; }
  .clock { position: absolute; left: 36px; top: 30px; line-height: 1; }
  .clock .t { font: 800 44px 'M PLUS Rounded 1c'; }
  .clock .d { font: 700 14px 'M PLUS Rounded 1c'; margin-top: 4px; }
  svg.over { position: absolute; left: 0; top: 0; width: 610px; height: 363px; overflow: visible; }
</style></head>
<body><div id="out"></div>
<script>
const themes = {
  day:   { bg: 'rgb(254,225,232)', ink: '#3b2632', muted: '#8a6f7b', img: '1-home-day-panel.png' },
  night: { bg: 'rgb(27,35,80)',    ink: '#f3f1ff', muted: '#b9b6dc', img: '2-home-night-panel.png' },
};
let uid = 0;
function rng(seed) { let r = seed; return () => (r = (r * 9301 + 49297) % 233280) / 233280; }
function star4(x, y, s, fill = '#fff', op = 1) {
  const q = s * 0.16;
  return `<path transform="translate(${x},${y})" opacity="${op}" d="M0,-${s} Q${q},-${q} ${s},0 Q${q},${q} 0,${s} Q-${q},${q} -${s},0 Q-${q},-${q} 0,-${s}Z" fill="${fill}"/>`;
}

// Flat trophy, upright (viewBox 0 0 200 260): two gold tones, white gloss, curled handles, hex knot, tall flared stem.
function trophy(twinkle = true) {
  const gold = '#fcb918', shade = '#eaa012', deep = '#d98c0c', lite = '#ffd04a';
  const handle = (m) => `<g transform="${m}">
      <path d="M48,46 C40,22 14,22 10,44 C6,70 30,92 56,112 C64,118 66,126 60,130 C55,133 50,128 54,124"
        stroke="${gold}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14,50 C14,72 34,92 54,108" stroke="${shade}" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>`;
  let s = `
    ${handle('')}${handle('translate(200,0) scale(-1,1)')}
    <path d="M46,54 L154,54 C154,100 130,124 100,126 C70,124 46,100 46,54 Z" fill="${gold}"/>
    <path d="M46,54 L60,54 C60,96 76,118 100,126 C70,124 46,100 46,54 Z" fill="${shade}"/>
    <rect x="40" y="40" width="120" height="16" rx="2" fill="${gold}"/>
    <rect x="40" y="52" width="120" height="5" fill="${shade}"/>
    <rect x="40" y="40" width="120" height="4" rx="2" fill="${lite}"/>
    <path d="M128,74 C134,76 134,92 126,100 C121,104 118,98 121,92 C124,86 124,80 128,74 Z" fill="#fff" opacity=".92"/>
    <circle cx="117" cy="108" r="3.6" fill="#fff" opacity=".92"/>
    <path d="M86,126 L114,126 L120,135 L114,144 L86,144 L80,135 Z" fill="${gold}"/>
    <path d="M80,135 L120,135 L114,144 L86,144 Z" fill="${shade}"/>
    <path d="M90,144 L110,144 L122,222 L78,222 Z" fill="${gold}"/>
    <path d="M90,144 L97,144 L88,222 L78,222 Z" fill="${shade}"/>
    <path d="M104,144 L110,144 L122,222 L114,222 Z" fill="${lite}" opacity=".55"/>
    <rect x="70" y="222" width="60" height="16" rx="1.5" fill="${gold}"/>
    <rect x="70" y="222" width="10" height="16" fill="${shade}"/>
    <rect x="62" y="238" width="76" height="14" rx="1.5" fill="${shade}"/>
    <rect x="62" y="248" width="76" height="4" fill="${deep}"/>`;
  if (twinkle) {
    // Small sparkles all over the cup, each on its own phase (the frame shows them at different brightness).
    const spots = [[66,70,6,1],[142,62,4,.7],[100,92,5,.9],[58,30,4,.6],[150,104,3.5,.8],[96,180,4,.85],[112,232,3.5,.6],[24,62,3,.75],[176,40,3,.5],[84,138,3,.7]];
    s += spots.map(([x, y, r, o]) => star4(x, y, r, '#fff', o)).join('');
    s += `<circle cx="132" cy="46" r="1.6" fill="#fff" opacity=".9"/><circle cx="74" cy="210" r="1.4" fill="#fff" opacity=".8"/>`;
    // The periodic big glint at its peak, on the rim.
    s += `<circle cx="146" cy="42" r="15" fill="url(#glow)"/>${star4(146, 42, 14)}`;
  }
  return s;
}

// Explosion bubble: irregular spikes (a few long ones), thick dark outline, grey drop shadow, halftone dots that grow
// toward the edge.
function bubble(fill, dot, text, seed) {
  // A big body with fewer, uneven spikes whose sides curve inward (the picture's "explosion"), not a regular star.
  const u = 'b' + (uid++), R = rng(seed), n = 13, RX = 100, RY = 56;
  const at = (a, k) => [Math.cos(a) * RX * k, Math.sin(a) * RY * k];
  const valleys = [], tips = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + (R() - .5) * .25;
    valleys.push(at(a, .86 + R() * .06));
    const ta = a + Math.PI / n + (R() - .5) * .2;
    tips.push(at(ta, 1.12 + R() * (R() < .35 ? .5 : .2)));
  }
  const pull = (p, f) => [p[0] * f, p[1] * f];
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  let d = `M${valleys[0].map(v => v.toFixed(1)).join(',')}`;
  for (let i = 0; i < n; i++) {
    const v = valleys[i], t = tips[i], w = valleys[(i + 1) % n];
    d += ` Q${pull(mid(v, t), .9).map(v => v.toFixed(1)).join(',')} ${t.map(v => v.toFixed(1)).join(',')}`;
    d += ` Q${pull(mid(t, w), .9).map(v => v.toFixed(1)).join(',')} ${w.map(v => v.toFixed(1)).join(',')}`;
  }
  d += 'Z';
  let dots = '';
  for (let y = -90; y <= 90; y += 6) for (let x = -170; x <= 170; x += 6) {
    const xx = x + ((y / 6) % 2 ? 3 : 0);
    const r = Math.max(0, (Math.hypot(xx / RX, y / RY) - .4) * 2.4);
    if (r > .15) dots += `<circle cx="${xx}" cy="${y}" r="${Math.min(r, 2.4).toFixed(2)}"/>`;
  }
  return `<defs><clipPath id="${u}"><path d="${d}"/></clipPath></defs>
    <path d="${d}" transform="translate(7,7)" fill="#8f888b" opacity=".5"/>
    <path d="${d}" fill="${fill}"/>
    <g clip-path="url(#${u})" fill="${dot}">${dots}</g>
    <path d="${d}" fill="none" stroke="#231b24" stroke-width="5.5" stroke-linejoin="round"/>
    <text x="0" y="10" text-anchor="middle" font-family="Bangers" font-size="30" letter-spacing="1" fill="#fff" stroke="#231b24" stroke-width="5.5" paint-order="stroke">${text}</text>`;
}

const bubbles = [['teal (as in your picture)', '#1fa598', '#0f5f58'], ['Rin pink', '#ec5a8c', '#9e2352']];
const glow = `<defs><radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;
const out = document.getElementById('out');
out.insertAdjacentHTML('beforeend', `<div class="label">A4 · flat trophy, upright, sparkles all over (big view)</div>
  <div class="row"><svg class="big" viewBox="-10 0 220 270">${glow}${trophy()}</svg>
  ${bubbles.map(([n, f, d], i) => `<svg class="big" viewBox="-170 -120 340 240" style="height:240px">${bubble(f, d, 'TOURNAMENT!', 11 + i)}</svg>`).join('')}</div>`);
for (const [name, f, d] of bubbles) {
  out.insertAdjacentHTML('beforeend', `<div class="label">On the home panel · bubble ${name}</div>`);
  let html = '<div class="row">';
  for (const key of ['day', 'night']) {
    const t = themes[key];
    html += `<div class="panel"><img src="${t.img}"><div class="cover" style="background:${t.bg}"></div>
      <div class="clock"><div class="t" style="color:${t.ink}">06:58</div><div class="d" style="color:${t.muted}">Sat, Oct 3</div></div>
      <svg class="over" viewBox="0 0 610 363">${glow}
        <g transform="translate(46,168) scale(.72)">${trophy()}</g>
        <g transform="translate(206,128) rotate(-8) scale(.66)">${bubble(f, d, 'TOURNAMENT!', 11 + bubbles.findIndex(b => b[1] === f))}</g>
      </svg></div>`;
  }
  out.insertAdjacentHTML('beforeend', html + '</div>');
}
</script></body></html>
